[package]
name = "someday"
version = "0.1.1"
description = "Save now. Deal with it someday."
edition = "2021"
rust-version = "1.93"

[lib]
name = "someday_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["time"] }
ammonia = "4.2.4"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
tauri-plugin-global-shortcut = "2"
rfd = { version = "0.17.2", default-features = false }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
clipboard-win = { version = "5.4.3", features = ["monitor"] }
windows = { version = "0.62.2", features = [
  "Win32_UI_Shell", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com",
  "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Threading", "Win32_Storage_FileSystem",
  "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
  "Win32_System_Variant", "Win32_System_Com_StructuredStorage",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
